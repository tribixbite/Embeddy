# F-Droid build recipe for Embeddy.
#
# This file is a *draft of what belongs in fdroiddata*, kept here so it is
# reviewed alongside the code it builds. To submit, copy it to
# fdroiddata/metadata/app.embeddy.yml and open a merge request against
# https://gitlab.com/fdroid/fdroiddata — F-Droid does not read this copy.
#
# Listing text, screenshots and changelogs are NOT duplicated here: F-Droid
# reads those from fastlane/metadata/android/en-US/ in this repository.

Categories:
  - Multimedia
  - Graphics
License: GPL-3.0-only
AuthorName: tribixbite
SourceCode: https://github.com/tribixbite/Embeddy
IssueTracker: https://github.com/tribixbite/Embeddy/issues
Changelog: https://github.com/tribixbite/Embeddy/releases

AutoName: Embeddy

RepoType: git
Repo: https://github.com/tribixbite/Embeddy.git

Builds:
  - versionName: 0.1.43
    versionCode: 143
    commit: v0.1.43
    subdir: app
    gradle:
      - yes
    # The project builds per-ABI splits plus a universal APK by default, but
    # F-Droid publishes exactly one APK per build entry. -PsingleApk disables
    # splitting so the build emits a single APK carrying every ABI. This is a
    # supported flag in app/build.gradle.kts, not a patch applied at build time.
    gradleprops:
      - singleApk

MaintainerNotes: |
    Versioning: the release workflow writes the resolved version into
    version.properties and tags that commit, so a build from the tag reproduces
    the published versionName/versionCode without any environment variables.
    Building a tag without BUILD_NUMBER set is the supported path.

    Native code: FFmpeg is consumed as a prebuilt AAR from Maven Central
    (com.moizhassan.ffmpeg:ffmpeg-kit-16kb, source at
    https://github.com/moizhassankh/ffmpeg-kit-android-16KB). This is a
    community rebuild of arthenica/ffmpeg-kit, which was retired on 2025-01-06
    and had its binaries pulled from Maven Central on 2025-04-01. The rebuild
    exists to add 16 KB page-size support required by API 35.

    AVIF encoding uses com.github.awxkee:avif-coder via JitPack.

    Both are prebuilt FLOSS binaries from repositories listed in scanner.py's
    allowed_repos. Precedent for a prebuilt FFmpeg from Maven Central: Seal
    (com.junkfood.seal) and YTDLnis (com.deniscerri.ytdl) both consume a
    third-party republished FFmpeg AAR as a plain gradle dependency.

    Note the artifact's POM declares LGPL-3.0 but the binary is built
    --enable-gpl --enable-version3, i.e. GPL-3.0. That is compatible with this
    app's GPL-3.0-only licence, but the artifact metadata is wrong.

    If a source build is preferred, it does not need a new srclib — the existing
    anonfaded-ffmpeg-kit-16KB srclib works, and FadCam's accepted recipe already
    proves --enable-libwebp (which this app requires for libwebp_anim) builds on
    the buildserver. Replace the Builds entry above with:

      sudo:
        - apt-get update
        - apt-get install -y make autoconf automake libtool pkg-config curl
          nasm cmake gcc gperf texinfo yasm bison autogen wget autopoint meson
          ninja-build ragel groff gtk-doc-tools libtasn1-6-dev libtasn1-bin
          libgnutls28-dev libunistring-dev
      timeout: 10800
      ndk: r27
      srclibs:
        - anonfaded-ffmpeg-kit-16KB@<pinned-commit>
      prebuild:
        # point the gradle dependency at the AAR built below
        - sed -i -e '/^ffmpeg-kit = /d' ../gradle/libs.versions.toml
        - sed -i -e 's|implementation(libs.ffmpeg.kit)|implementation(files("libs/ffmpeg-kit.aar"))\n    implementation("com.arthenica:smart-exception-java:0.2.1")|' build.gradle.kts
        - sdkmanager "ndk;27.3.13750724"
      build:
        - pushd $$anonfaded-ffmpeg-kit-16KB$$
        - ANDROID_SDK_ROOT=$$SDK$$ ANDROID_NDK_ROOT=$$SDK$$/ndk/27.3.13750724
          ./android.sh --enable-libwebp --enable-gpl --api-level=26
        - popd
        - mkdir -p libs
        - mv $$anonfaded-ffmpeg-kit-16KB$$/prebuilt/bundle-android-aar/ffmpeg-kit/*.aar libs/ffmpeg-kit.aar

    --enable-libwebp is load-bearing: without it FFmpeg's configure silently
    disables the libwebp_anim encoder (check_pkg_config, not require_pkg_config)
    and every conversion fails with "Unknown encoder 'libwebp_anim'".

    No Google Play Services, no analytics, no ads, no tracking. Network access
    is limited to URLs the user types (Inspect) and files the user chooses to
    upload (Upload, to 0x0.st or catbox.moe).

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags ^v[0-9.]+$
