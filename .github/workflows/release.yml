name: Build & Release

on:
  push:
    branches: [main]
    # Only cut a version when something that affects the APK changed. Docs, site
    # and worker pushes still run Tests and deploy Pages, they just don't mint a
    # release — otherwise tags become a build counter rather than a marker of
    # actual app changes, which also keeps the F-Droid recipe churning.
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'version.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
  # Lets you ship a release for a change outside those paths when you want one.
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          source version.properties
          BUILD_NUM=${{ github.run_number }}
          echo "major=${VERSION_MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION_MINOR}" >> "$GITHUB_OUTPUT"
          echo "patch=${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_MAJOR}.${VERSION_MINOR}.${BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + BUILD_NUM))" >> "$GITHUB_OUTPUT"

      # Run the unit tests before producing artifacts — a failing suite should
      # block the release rather than be discovered after the tag exists.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # F-Droid republishes the APK built here rather than signing its own, so
      # this key is the app's identity. Without the secrets the build still
      # succeeds but falls back to a per-runner debug key and warns loudly.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 not set — release APKs will be debug-signed and cannot be installed as updates."
            exit 0
          fi

          # Fail here with a clear message rather than 3 ABI builds later with
          # "keystore password was incorrect" from deep inside packageRelease.
          #
          # Note "missing" also covers *empty*: `gh secret set NAME` reads the
          # value from stdin, so running it without a terminal stores an empty
          # string. The secret then shows up in `gh secret list` but arrives here
          # blank — GitHub masks a non-empty secret as ***, an empty one prints
          # as nothing in the step's env dump.
          missing=""
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "${KEY_PASSWORD:-}" ] || missing="$missing KEY_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || missing="$missing KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::These signing secrets are unset or empty:$missing"
            echo "A secret can exist but be empty if 'gh secret set' ran without a terminal."
            echo "Set each from a real shell so gh can prompt, or pipe a value:"
            echo "  printf '%s' \"\$PASSWORD\" | gh secret set <NAME> --repo ${{ github.repository }}"
            echo "See fdroid/README.md > Signing."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

          # Verify the password up front — same reason.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore decoded but KEYSTORE_PASSWORD/KEY_ALIAS do not open it."
            exit 1
          fi

          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          echo "Release keystore decoded and verified."

      # REPRODUCIBILITY: build each ABI separately, exactly as F-Droid does.
      #
      # F-Droid publishes this APK rather than signing its own, so its build must
      # reproduce ours byte-for-byte. Building all ABIs in one invocation does
      # NOT produce the same per-ABI APK as building that ABI alone — measured
      # locally: same 452 entries, but one dex differs. Same inputs are otherwise
      # deterministic, so the split configuration itself is the variable.
      #
      # clean + --no-build-cache keeps each pass independent of the last.
      - name: Build Release APKs (per ABI, matching F-Droid)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_MAJOR: ${{ steps.version.outputs.major }}
          VERSION_MINOR: ${{ steps.version.outputs.minor }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p final_apks

          for ABI in armeabi-v7a arm64-v8a x86_64; do
            echo "::group::Building $ABI"
            ./gradlew clean assembleRelease -PabiFilter="$ABI" \
              --no-daemon --no-build-cache --stacktrace
            cp app/build/outputs/apk/release/Embeddy-v*-"$ABI".apk final_apks/
            echo "::endgroup::"
          done

          # Universal APK for people who do not know their ABI. Not verified by
          # F-Droid — it has no build entry — but useful on the releases page.
          echo "::group::Building universal"
          ./gradlew clean assembleRelease -PsingleApk \
            --no-daemon --no-build-cache --stacktrace
          cp app/build/outputs/apk/release/Embeddy-v*-universal.apk final_apks/
          echo "::endgroup::"

          ls -1 final_apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: embeddy-v${{ steps.version.outputs.version_name }}
          path: final_apks/*.apk
          retention-days: 30

      # Write the resolved version into the tree and tag *that* commit.
      # Without this the version lives only in this job's environment, so anyone
      # building from the tag — F-Droid included — gets whatever stale patch
      # number version.properties happened to hold, not the released version.
      #
      # The commit below carries GitHub's skip-CI marker so this push does not
      # re-trigger the workflow. NOTE: GitHub scans the whole commit message, so
      # never write that marker in the body of an ordinary commit — doing so
      # silently skips every workflow for that push.
      - name: Pin version into the tagged commit
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: pin
        run: |
          set -euo pipefail
          cat > version.properties <<EOF
          VERSION_MAJOR=${{ steps.version.outputs.major }}
          VERSION_MINOR=${{ steps.version.outputs.minor }}
          VERSION_PATCH=${{ steps.version.outputs.patch }}
          EOF

          # Write the F-Droid changelog for THIS versionCode in the same commit.
          # F-Droid reads fastlane metadata from the tag it builds, and the
          # version number isn't known until this job runs — so a hand-written
          # changelog could never land in its own tag. Generated from the feat/fix
          # subjects since the last tag, which is what a user cares about.
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.version_code }}.txt"
          mkdir -p "$(dirname "$CHANGELOG")"
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ ! -f "$CHANGELOG" ]; then
            {
              git log ${PREV:+${PREV}..HEAD} --pretty=format:'%s' --no-merges \
                | grep -E '^(feat|fix)(\(.+\))?!?: ' \
                | sed -E 's/^[a-z]+(\(.+\))?!?: //' \
                | head -12 \
                | sed 's/^/- /'
            } > "$CHANGELOG" || true
            # Never commit an empty changelog — F-Droid renders it verbatim
            if [ ! -s "$CHANGELOG" ]; then
              echo "Maintenance release: internal and packaging changes only." > "$CHANGELOG"
            fi
            echo "--- generated $CHANGELOG ---"; cat "$CHANGELOG"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties "$CHANGELOG"
          if git diff --cached --quiet; then
            echo "version.properties already correct"
          else
            git commit -m "chore(release): pin version to v${{ steps.version.outputs.version_name }} and add changelog [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: notes
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          VERSION="v${{ steps.version.outputs.version_name }}"
          RANGE=${PREV_TAG:+${PREV_TAG}..HEAD}

          # Group commits by conventional-commit type. `git log` output is read
          # into a file first so the pipeline can't swallow a failure.
          # The version-pin commits this workflow makes are plumbing, not
          # changes, so they are dropped rather than listed under "Internal".
          git log ${RANGE:-} --pretty=format:'%s' --no-merges \
            | grep -v '^chore(release): pin version to ' > /tmp/commits.txt || true

          # Render a section only when it has entries
          emit() {
            local heading="$1"; shift
            local body
            body=$(for prefix in "$@"; do
              grep -E "^${prefix}(\(.+\))?!?: " /tmp/commits.txt 2>/dev/null | sed -E 's/^[a-z]+(\(.+\))?!?: //' || true
            done | sed 's/^/- /')
            if [ -n "$body" ]; then
              echo "### ${heading}"
              echo ""
              echo "$body"
              echo ""
            fi
          }

          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "## Embeddy ${VERSION}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since [\`${PREV_TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${PREV_TAG})."
            else
              echo "First tracked release."
            fi
            echo ""

            emit "New" "feat"
            emit "Fixed" "fix"
            emit "Performance" "perf"
            emit "Internal" "refactor" "build" "ci" "test" "chore"
            emit "Documentation" "docs"

            echo "### Downloads"
            echo ""
            echo "Pick the ABI matching your device, or \`universal\` if unsure."
            echo ""
            echo "| ABI | Best for | Size | SHA-256 |"
            echo "|-----|----------|------|---------|"
            for apk in final_apks/*.apk; do
              name=$(basename "$apk")
              size=$(du -h "$apk" | cut -f1)
              sha=$(sha256sum "$apk" | cut -c1-16)
              case "$name" in
                *arm64-v8a*)   desc="Modern 64-bit phones" ;;
                *armeabi-v7a*) desc="Older 32-bit ARM devices" ;;
                *x86_64*)      desc="Emulators, Chromebooks" ;;
                *universal*)   desc="Any device (largest)" ;;
                *)             desc="—" ;;
              esac
              echo "| \`${name##Embeddy-v${{ steps.version.outputs.version_name }}-}\` | ${desc} | ${size} | \`${sha}…\` |"
            done
            echo ""
            echo "**Min Android:** 8.0 (API 26)"
            echo ""
            echo "Full checksums are in \`SHA256SUMS.txt\` below."
            echo ""
            # F-Droid's UpdateCheckMode: HTTP scrapes these two lines from the
            # releases page to detect a new version. The exact "Name: value"
            # shape is matched by UpdateCheckData in the recipe — changing the
            # wording here silently stops F-Droid seeing updates.
            echo "Version: ${{ steps.version.outputs.version_name }}"
            echo "VersionCode: ${{ steps.version.outputs.version_code }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Write checksum file
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cd final_apks
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          # Tag the version-pinned commit so a build from the tag reproduces
          # exactly this versionName/versionCode.
          target_commitish: ${{ steps.pin.outputs.sha }}
          name: Embeddy v${{ steps.version.outputs.version_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            final_apks/*.apk
            final_apks/SHA256SUMS.txt
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
